# Build, test, push, sign and verify crew's curated images (IMG-1, tycho-ultimate/crew#56).
#
# On a pull request: tests/run.sh, then each image built for linux/amd64 and linux/arm64 and its test job run
# (ci/image_test.py). Nothing is pushed or signed; no job has packages: write or id-token: write.
#
# On a push to main, the weekly refresh and a manual dispatch (on main only): the same build and test, then a push
# to ghcr.io/tycho-ultimate/crew-images/<image> by digest (only the tested build), one multi-arch index tagged
# `main`, cosign keyless signatures on the index and each platform manifest, `cosign verify` of each against this
# workflow's identity on main, and the images.toml entries to propose in crew-fleet (in the log and the summary).
#
# Each platform builds natively on GitHub's hosted runners (ubuntu-24.04 and ubuntu-24.04-arm): no emulation.
# Every action is pinned by full commit SHA. The only secret is GITHUB_TOKEN. Never pull_request_target.
name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"   # weekly refresh, Mondays 05:23 UTC: Debian's updates on the pinned base
  workflow_dispatch:

# A pull request's newer push cancels its older run. A publishing run is never cancelled half-way: runs on main
# queue instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tests/run.sh
        run: tests/run.sh

  # Pull requests: build and test each image on each platform; no push, no signing.
  image-test:
    name: test ${{ matrix.image }} ${{ matrix.arch }}
    if: ${{ github.event_name == 'pull_request' }}
    needs: tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [base]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and test
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: ci/build.sh "$IMAGE" "$ARCH" test
      - name: the test job fails on broken copies of the image
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: python3 -I tests/image_mutations.py "crew-images-test/$IMAGE:$ARCH" "$IMAGE"

  # main (push, schedule, dispatch): the same build and test, then push the tested build by digest.
  build:
    name: build ${{ matrix.image }} ${{ matrix.arch }}
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [base]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build, test, push by digest
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: ci/build.sh "$IMAGE" "$ARCH" push
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.image }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  # main: one index per image, signed, verified, and its images.toml entries printed.
  publish:
    name: publish ${{ matrix.image }}
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [base]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: index, sign, verify, print the images.toml entries
        env:
          IMAGE: ${{ matrix.image }}
        run: ci/publish.sh "$IMAGE"
